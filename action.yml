name: forever-lint
description: Check World of Warcraft addons for problems on WoW Forever and upload the results to GitHub code scanning.
branding:
  icon: check-circle
  color: orange
inputs:
  path:
    description: Addon folder(s) to check, space separated
    default: "."
  fail-on:
    description: "Fail the step at this severity or worse: error, warning, note or never"
    default: error
  sarif:
    description: Upload a SARIF report to code scanning (needs security-events write permission)
    default: "true"
  version:
    description: forever-lint version to install (default the latest)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "forever-lint${{ inputs.version && format('=={0}', inputs.version) || '' }}"
    - shell: bash
      run: forever-lint ${{ inputs.path }} --no-color --fail-on never
    - if: inputs.sarif == 'true'
      shell: bash
      run: forever-lint ${{ inputs.path }} --format sarif --fail-on never -o forever-lint.sarif
    - if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: forever-lint.sarif
        category: forever-lint
    - shell: bash
      run: forever-lint ${{ inputs.path }} --no-color --fail-on ${{ inputs.fail-on }} > /dev/null
