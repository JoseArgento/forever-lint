<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forever Addon Index</title>
<link rel="alternate" type="application/rss+xml" title="Now works on WoW Forever" href="feed.xml">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Static compatibility check of popular World of Warcraft addons against WoW Forever, generated by forever-lint.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a departures board. One row per addon, status first, details fold out under the row. */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #1a1f24; --muted: #5d6670; --line: #d8dcd6; --accent: #2f5d8a;
  --clean: #2c7a4b; --warn: #a36a00; --err: #b23a2e; --noload: #5b5f66; --chip: #e9ebe6;
  --display: "Archivo Narrow", "Arial Narrow", sans-serif; --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14171a; --panel: #1b1f23; --ink: #e5e8eb; --muted: #9aa3ab; --line: #2d3339; --accent: #7fb0de; --clean: #6cc48f; --warn: #e2b04a; --err: #f07a6e; --noload: #a4a9b0; --chip: #252a30; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #14171a; --panel: #1b1f23; --ink: #e5e8eb; --muted: #9aa3ab; --line: #2d3339; --accent: #7fb0de; --clean: #6cc48f; --warn: #e2b04a; --err: #f07a6e; --noload: #a4a9b0; --chip: #252a30; color-scheme: dark; }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 8px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 clamp(30px, 6vw, 46px)/1 var(--display); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.build { font: 500 13px var(--mono); color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { font: 500 13px var(--mono); padding: 5px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.tally button { display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: 600 14px var(--body); cursor: pointer; }
.tally button[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
.tally b { font: 500 13px var(--mono); }
.search { flex: 1 1 200px; min-width: 0; font: 15px var(--body); padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.board { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.row { border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; }
.row > summary::-webkit-details-marker { display: none; }
@media (max-width: 620px) { .row > summary { grid-template-columns: 1fr; gap: 6px; } }
.pill { font: 600 12px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; text-align: center; color: var(--panel); justify-self: start; }
.s-clean { background: var(--clean); } .s-warnings { background: var(--warn); } .s-errors { background: var(--err); } .s-no-load { background: var(--noload); }
.name { min-width: 0; }
.name strong { font: 700 18px/1.2 var(--display); letter-spacing: 0.01em; }
.name small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.nums { display: flex; gap: 12px; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.nums .e { color: var(--err); } .nums .w { color: var(--warn); }
.detail { padding: 4px 16px 18px; display: grid; gap: 14px; }
.detail h3 { font: 700 15px var(--display); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 6px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chips li { background: var(--chip); border-radius: 6px; padding: 3px 8px; font: 13px var(--mono); }
.chips li span { color: var(--muted); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 420px; overflow: auto; }
.list li { font-size: 14px; display: grid; gap: 2px; border-left: 3px solid var(--line); padding-left: 10px; }
.list li.error { border-color: var(--err); } .list li.warning { border-color: var(--warn); }
.list > li > code { font: 12.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.list span code { font: 13px var(--mono); background: var(--chip); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 28px; color: var(--muted); font-size: 15px; }
.method h2 { font: 700 18px var(--display); color: var(--ink); margin: 0 0 4px; }
.method p { margin: 0; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 data-t="title"></h1>
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
    <p class="sub" data-t="sub"></p>
    <p class="build" id="build"></p>
    <p class="build" data-t="legend"></p>
    <p class="build"><a href="api.html" data-t="toApi"></a> · <a href="feed.xml" data-t="toFeed"></a></p>
  </header>
  <div class="tally" id="tally"></div>
  <div class="board" id="board"></div>
  <p class="note" id="failures" hidden></p>
  <section class="method">
    <div><h2 data-t="howTitle"></h2><p data-t="howText"></p></div>
    <div><h2 data-t="limitTitle"></h2><p data-t="limitText"></p></div>
    <div><h2 data-t="addTitle"></h2><p data-t="addText"></p></div>
  </section>
</div>
<script>/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  const T = {
    en: {
      title: "Forever Addon Index",
      toApi: "Porting an addon? Every Classic API that moved in Forever →", toFeed: "RSS feed: addons that started working this week",
      legend: "E = errors (missing API, events, no TOC), W = warnings, N = notes. Made with forever-lint: github.com/JoseArgento/forever-lint",
      sub: "How popular World of Warcraft addons look on WoW Forever, checked automatically from their source code with forever-lint.",
      build: (d) => `WoW Forever ${d.target.version} (${d.target.build}) · interface ${d.target.interface} · forever-lint ${d.linter} · updated ${d.generated.slice(0, 10)}`,
      status: { clean: "No problems", warnings: "Warnings", errors: "Errors", "no-load": "Does not load" },
      all: "All", search: "Search addons",
      modules: (n) => `${n} module${n === 1 ? "" : "s"}`, files: "Lua files",
      toc: "TOC Forever loads", tocNone: "none", ported: "explicit Forever TOC", commit: "Checked commit",
      missing: "Most used missing APIs", problems: "TOC problems", findings: (n, t) => `Findings (${n}${t > n ? " of " + t : ""})`,
      libs: (n) => `${n} more in embedded libraries (not counted).`, none: "Nothing found.",
      otherModules: (l) => `Modules for other clients that do not load in Forever (on purpose): ${l}.`,
      failed: (l) => `Could not check: ${l}.`,
      howTitle: "How it works",
      howText: "Every week a GitHub Action downloads each addon's public repository and runs forever-lint on the files Forever would load: it reports API that does not exist in Forever, secret values, project ID checks, events and TOC files. Data comes from the Forever client itself.",
      limitTitle: "Read with care",
      limitText: "It is static analysis of the latest source, not a test in game. A finding can sit in code that only runs on other clients, and the addon's released version may differ from its repository.",
      addTitle: "Add an addon",
      addText: "Open a pull request adding its public GitHub repository to index/addons.json in the forever-lint repository. Authors who prefer not to be listed can open an issue and it is removed.",
    },
    es: {
      title: "Índice de addons para Forever",
      toApi: "¿Portás un addon? Toda la API de Classic que cambió en Forever →", toFeed: "Feed RSS: qué addons empezaron a andar esta semana",
      legend: "E = errores (API que no existe, eventos, sin TOC), W = avisos, N = notas. Hecho con forever-lint: github.com/JoseArgento/forever-lint",
      sub: "Cómo quedan los addons populares de World of Warcraft en WoW Forever, revisados automáticamente desde su código con forever-lint.",
      build: (d) => `WoW Forever ${d.target.version} (${d.target.build}) · interfaz ${d.target.interface} · forever-lint ${d.linter} · actualizado ${d.generated.slice(0, 10)}`,
      status: { clean: "Sin problemas", warnings: "Avisos", errors: "Errores", "no-load": "No carga" },
      all: "Todos", search: "Buscar addons",
      modules: (n) => `${n} módulo${n === 1 ? "" : "s"}`, files: "archivos Lua",
      toc: "TOC que carga Forever", tocNone: "ninguno", ported: "TOC propio para Forever", commit: "Commit revisado",
      missing: "API faltante más usada", problems: "Problemas del TOC", findings: (n, t) => `Hallazgos (${n}${t > n ? " de " + t : ""})`,
      libs: (n) => `${n} más en librerías embebidas (no cuentan).`, none: "Nada encontrado.",
      otherModules: (l) => `Módulos para otros clientes que no cargan en Forever (a propósito): ${l}.`,
      failed: (l) => `No se pudo revisar: ${l}.`,
      howTitle: "Cómo funciona",
      howText: "Cada semana una GitHub Action baja el repositorio público de cada addon y corre forever-lint sobre los archivos que cargaría Forever: API que no existe en Forever, valores secretos, chequeos de versión, eventos y archivos TOC. Los datos salen del propio cliente de Forever.",
      limitTitle: "Leelo con cuidado",
      limitText: "Es análisis estático del código más nuevo, no una prueba en el juego. Un hallazgo puede estar en código que solo corre en otros clientes, y la versión publicada del addon puede ser distinta del repositorio.",
      addTitle: "Sumar un addon",
      addText: "Abrí un pull request que agregue su repositorio público de GitHub a index/addons.json en el repo de forever-lint. Si un autor prefiere no aparecer, abre un issue y se saca.",
    },
  };
  const D = INDEX_DATA;
  let lang = (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
  try { const s = localStorage.getItem("forever-index-lang"); if (s === "en" || s === "es") lang = s; } catch (e) {}
  let filter = "all", query = "";
  const open = new Set();
  const $ = (s) => document.querySelector(s);
  // `name` in messages becomes <code>name</code> (text nodes only, nothing is parsed as HTML)
  const rich = (text) => {
    const span = document.createElement("span");
    text.split("`").forEach((part, i) => { if (!part) return; if (i % 2) { const c = document.createElement("code"); c.textContent = part; span.append(c); } else span.append(part); });
    return span;
  };
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v); }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  function render() {
    const L = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = L[n.dataset.t]; });
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("#build").textContent = L.build(D);
    const counts = { all: D.addons.length };
    for (const a of D.addons) counts[a.status] = (counts[a.status] || 0) + 1;
    const tally = $("#tally");
    const search = el("input", { class: "search", id: "q", type: "search", placeholder: L.search, "aria-label": L.search });
    search.value = query;
    search.addEventListener("input", () => { query = search.value; drawBoard(); });
    tally.replaceChildren(
      ...["all", "clean", "warnings", "errors", "no-load"].filter((s) => s === "all" || counts[s]).map((s) => {
        const b = el("button", { type: "button", "aria-pressed": String(filter === s), class: s === "all" ? "" : "t-" + s }, s === "all" ? L.all : L.status[s], el("b", { text: String(counts[s] || 0) }));
        b.style.color = s === "all" ? "" : `var(--${{ clean: "clean", warnings: "warn", errors: "err", "no-load": "noload" }[s]})`;
        b.addEventListener("click", () => { filter = s; render(); });
        return b;
      }),
      search,
    );
    drawBoard();
    const f = $("#failures");
    f.hidden = !D.failures.length;
    if (D.failures.length) f.textContent = L.failed(D.failures.map((x) => x.name).join(", "));
  }
  function drawBoard() {
    const L = T[lang];
    const q = query.trim().toLowerCase();
    const rows = D.addons.filter((a) => (filter === "all" || a.status === filter) && (!q || a.name.toLowerCase().includes(q) || a.repo.toLowerCase().includes(q)));
    $("#board").replaceChildren(...rows.map((a) => {
      const d = el("details", { class: "row", id: a.slug });
      if (open.has(a.slug)) d.open = true;
      d.addEventListener("toggle", () => { if (d.open) open.add(a.slug); else open.delete(a.slug); });
      d.append(el("summary", {},
        el("span", { class: `pill s-${a.status}`, text: L.status[a.status] }),
        el("span", { class: "name" }, el("strong", { text: a.name }), el("small", { text: `${a.repo} · ${a.toc || L.tocNone}${a.forever_toc ? " · " + L.ported : ""}` })),
        el("span", { class: "nums", "aria-label": "errors, warnings, notes" },
          el("span", { class: "e", text: `E ${a.counts.error}` }), el("span", { class: "w", text: `W ${a.counts.warning}` }), el("span", { text: `N ${a.counts.note}` })),
      ));
      const kv = el("dl", { class: "kv" },
        el("dt", { text: L.toc }), el("dd", { text: (a.toc || L.tocNone) + (a.forever_toc ? ` (${L.ported})` : "") }),
        el("dt", { text: L.files }), el("dd", { text: `${a.lua_files} · ${L.modules(a.modules)}` }),
        el("dt", { text: L.commit }), el("dd", {}, el("a", { href: `https://github.com/${a.repo}/tree/${a.commit}`, target: "_blank", rel: "noopener", text: a.commit.slice(0, 7) }), " · " + a.commit_date.slice(0, 10)));
      const parts = [kv];
      if (a.top_missing.length) parts.push(el("div", {}, el("h3", { text: L.missing }), el("ul", { class: "chips" }, ...a.top_missing.map((m) => el("li", {}, `${m.name} ×${m.count}`, m.use.length ? el("span", { text: " → " + m.use.join(", ") }) : null)))));
      if (a.problems.length) parts.push(el("div", {}, el("h3", { text: L.problems }), el("ul", { class: "list" }, ...a.problems.map((p) => el("li", { class: p.severity }, el("code", { text: `${p.rule} · ${p.module}` }), rich(p.message))))));
      parts.push(el("div", {}, el("h3", { text: L.findings(a.findings.length, a.findings_total) }),
        a.findings.length ? el("ul", { class: "list" }, ...a.findings.map((f) => el("li", { class: f.severity }, el("code", { text: `${f.rule} · ${f.file}:${f.line}` }), rich(f.message)))) : el("p", { class: "note", text: L.none }),
        a.library_findings ? el("p", { class: "note", text: L.libs(a.library_findings) }) : null));
      if (a.modules_not_loading && a.modules_not_loading.length) parts.push(el("p", { class: "note", text: L.otherModules(a.modules_not_loading.join(", ")) }));
      d.append(el("div", { class: "detail" }, ...parts));
      return d;
    }));
  }
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("forever-index-lang", lang); } catch (e) {} render(); }));
  render();
  // a link like index.html#bagnon (from the feed) opens that addon's row
  const target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (target && target.tagName === "DETAILS") { target.open = true; target.scrollIntoView(); }
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t && t.tagName === "DETAILS") { t.open = true; open.add(t.id); t.scrollIntoView(); } }
})();
</script>
</body>
</html>
