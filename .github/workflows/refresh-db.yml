name: refresh API database

# Blizzard patches Forever often. This rebuilds the API database from the public
# dumps and opens a pull request when anything changed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the dumps and the UI source
        run: |
          mkdir -p vendor && cd vendor
          for b in forever classic_era classic classic_anniversary live; do
            git clone -q --depth 1 -b "$b" https://github.com/Ketho/BlizzardInterfaceResources.git "bir-$b"
          done
          for b in forever classic_era; do
            mkdir "ui-$b" && cd "ui-$b" && git init -q
            git remote add origin https://github.com/Gethe/wow-ui-source.git
            git fetch -q --depth 1 --filter=blob:none origin "$b"
            git sparse-checkout set --no-cone '/Interface/AddOns/Blizzard_Deprecated*/' '/Interface/AddOns/Deprecated_*/' \
              '/Interface/AddOns/Blizzard_FrameXML/Deprecated*' '/Interface/AddOns/Blizzard_Settings_Shared/Blizzard_Deprecated.lua' \
              '/Interface/AddOns/Blizzard_APIDocumentationGenerated/'
            git checkout -q FETCH_HEAD
            echo "UI_${b^^}=$(git log -1 --format=%s)" >> "$GITHUB_ENV"   # UI_FOREVER, UI_CLASSIC_ERA
            cd ..
          done
      - name: Rebuild
        run: |
          python tools/build_db.py --bir vendor --ui-forever vendor/ui-forever --ui-era vendor/ui-classic_era \
            --ui-forever-build "$UI_FOREVER" --history tools/history-names.txt | tee summary.txt
      - name: Test
        run: pip install pytest && pytest -q
      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The date in the file changes every run; only open a PR for real changes.
          if git diff --quiet -I'"generated":' -- src/forever_lint/data/api.json; then echo "no API changes"; exit 0; fi
          branch="refresh-db-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/forever_lint/data/api.json
          git commit -m "Refresh API database: $UI_FOREVER"
          git push -u origin "$branch"
          gh pr create --title "Refresh API database: $UI_FOREVER" --body "$(cat summary.txt)"
