name: compatibility index

# Rebuilds the Forever addon index and publishes it with GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
on:
  schedule:
    - cron: "41 7 * * 1"   # every Monday, after the API refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index/**", "src/forever_lint/data/api.json"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the addons
        run: |
          python index/build_index.py --cache .index-cache --out site
          python index/build_api.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
